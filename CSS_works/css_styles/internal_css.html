<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>
    <style>

        h1{
            background-color: pink;
            color: black;
        }
        h2{
            background-color:  rgb(132, 0, 255);
            color: white;
            border: 2px solid black;
        }
        .heading{
            background-color: blue;
            color: yellow;
        }
        .bg-danger{

            background-color: red;
        }
        .border-success{

            border: 2px solid green;
        }
        /* red=>danger,green=>success,yellow=>warning,blue=>primary */
        .bg-primary{

            background-color: blue;
        }

        .text-white{

            color: white;
        }

    </style>
</head>
<body>

    <h1>Internal CSS</h1>

    <h2>Welcome to CSS Journey</h2>

    <h1 class="heading">Python</h1>

    <h1 class="bg-danger border-success">Django Rest_Framework</h1>

    <h1 class="bg-primary text-white">ASP.NET</h1>

     
    
</body>
</html>
